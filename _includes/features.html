<section class="section features" id="features">
	<div class="container">
		<div class="sectionHead">
			<span class="kicker">What you get</span>
			<h2>Made for listening</h2>
			<p>Unrearix is a creative music team under one artist brand, moving freely across genres, styles and voices. Every release leads with feeling.</p>
		</div>

		<div class="featureGrid">
			{% for feature in site.features %}
			<div class="feature">
				<div class="iconTile">
					<svg class="icon" aria-hidden="true"><use href="#ic-{{ feature.icon }}"/></svg>
				</div>
				<h3>{{ feature.title }}</h3>
				<p>{{ feature.description }}</p>
			</div>
			{% endfor %}
		</div>
	</div>
</section>
