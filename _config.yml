# ==============================================================================
# Unrearix — landing page content.
#
# Copy here is the single source of truth for the site, and it must stay in sync
# with the app's store listing (unrearix/docs/store-listing.md, section 1-EN).
#
# COPY RULES — see docs/store-listing.md §4 and docs/redesign-4.2.2.md in the app repo:
#   1. Never claim "unlimited streaming" or "stream all songs". In-app playback
#      covers 5 bundled tracks; the catalogue is 48. Frame it as "browse the full
#      discography and play in the app".
#   2. Keep external platforms (YouTube) to a follow CTA. No Spotify or Apple
#      Music links — those artist accounts do not exist.
#   3. iPhone only. Never show an iPad mockup.
#   4. Body copy says "Unrearix"; only the wordmark is "UNREARIX".
# ==============================================================================

title: "Unrearix"
seo_title: "Unrearix: Boundary-Free Sound — Official App"
url: "https://unrearix.com"

app_name: "Unrearix"
app_icon: "assets/app-icon.png"
app_kicker: "Official artist app"
app_headline: "Boundary-free sound"
app_description: "The official Unrearix app — play songs, watch videos, follow every lyric."
app_meta: "In-app playback · Synced lyrics · Fan Pass"

# Store links are hard-coded: the template used to inject the App Store URL at
# runtime from the iTunes API, which left crawlers and no-JS visitors with no link.
appstore_link: "https://apps.apple.com/app/id6752011330"
playstore_link: "https://play.google.com/store/apps/details?id=kr.co.bullets.unrearix"

ios_app_id: 6752011330 # Smart App Banner only.
enable_smart_app_banner: true

og_image: "assets/og-image.jpg"

# Social — the artist's actual handles (app: assets/content/content.json).
youtube_url: "https://youtube.com/@unrearix"
instagram_url: "https://instagram.com/unrearix.official"
x_url: "https://x.com/unrearix"
email_address: "develop@bullets.co.kr"

your_name: "Bullets"

# ---- Features ----------------------------------------------------------------
# Mirrors the store description's section order: PLAY / WATCH / LIBRARY / LOUNGE.
features:
  - icon: play
    title: "Play, right here"
    description: "Browse the full Unrearix discography and play in the app, with background and lock-screen controls and a persistent mini-player."

  - icon: lyrics
    title: "Synced lyrics"
    description: "Follow every word. Lyrics scroll in time with the song, and you can tap any line to jump straight to it."

  - icon: video
    title: "Every music video"
    description: "Official releases, live moments and mixes, plus curated playlists that set the mood."

  - icon: library
    title: "Your library"
    description: "Like your favourites, build and reorder your own playlists, and save the videos you keep coming back to."

  - icon: sparkle
    title: "Make it yours"
    description: "Turn any lyric into a shareable card or a phone wallpaper with the built-in makers."

  - icon: badge
    title: "Your lounge"
    description: "Check in daily to build a streak, climb Fan Pass tiers, earn badges, and open your personal listening Recap."

# ---- Screenshots -------------------------------------------------------------
# Sources: unrearix/store-screenshots/_pipeline/sources/ios_en/
# Headlines: unrearix/docs/store-screenshots-guide.md (EN)
screens:
  - file: "1_player"
    kicker: "In-app player"
    headline: "Right now, play it in-app"
    alt: "The Unrearix player with synced lyrics scrolling under the artwork"

  - file: "2_music"
    kicker: "Discography"
    headline: "Browse the full discography"
    alt: "The music tab listing Unrearix releases"

  - file: "3_artist"
    kicker: "Unrearix"
    headline: "Boundary-free sound"
    alt: "The artist page with bio, discography and tour countdown"

  - file: "4_videos"
    kicker: "Videos"
    headline: "Every music video"
    alt: "The videos tab with releases, live sets and mixes"

  - file: "5_create"
    kicker: "Make it yours"
    headline: "Turn a lyric into your own card"
    alt: "The lyric card maker"

  - file: "6_lounge"
    kicker: "Lounge"
    headline: "Check in daily, build your Fan Pass"
    alt: "The lounge with daily check-in, Fan Pass tier and badges"

# ==============================================================================
# Jekyll configuration
# ==============================================================================

plugins:
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - LICENSE
  - README.md
  - Gemfile
  - Gemfile.lock

collections:
  pages:
    output: true
    permalink: /:path/

markdown: kramdown
